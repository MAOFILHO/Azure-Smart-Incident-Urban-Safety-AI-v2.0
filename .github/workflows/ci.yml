name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  smoke:
    name: Install, compile and import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile all modules
        run: python -m compileall -q src

      # The pipeline and web app need live Azure services, so CI only checks
      # that the core modules import with placeholder settings.
      - name: Import core modules
        env:
          AZURE_OPENAI_ENDPOINT: https://example.invalid
          AZURE_OPENAI_KEY: ci-placeholder
          AZURE_SEARCH_ENDPOINT: https://example.invalid
          AZURE_SEARCH_KEY: ci-placeholder
          DOC_INTELLIGENCE_ENDPOINT: https://example.invalid
          DOC_INTELLIGENCE_KEY: ci-placeholder
        run: python -c "import src.config, src.rag.engine, src.search.hybrid_search, src.telemetry"
